name: sdd
version: 1
description: Lightweight spec-driven development - prd → ux + specs → tech-plan → tasks, with tasks delegable to cloud agents
artifacts:
  - id: prd
    generates: prd.md
    description: Product requirements - the why and what, from the user's perspective
    template: prd.md
    instruction: |
      Create the PRD that establishes WHY this change is needed and WHAT it must do,
      from the user's perspective. No implementation details.

      Sections:
      - **Problem**: 1-3 sentences. What hurts, for whom, why now?
      - **Users & Jobs**: Who uses this and what job they are hiring it to do.
      - **Goals**: Measurable outcomes. Prefer verifiable statements ("p95 task start < 5s")
        over vibes ("fast").
      - **Non-Goals**: What this change explicitly will NOT do. Be aggressive - scope
        creep dies here.
      - **Capabilities**: The contract with the specs phase. Identify which specs will
        be created or modified:
        - **New Capabilities**: Each becomes a new `specs/<name>/spec.md`. Use
          kebab-case names (e.g., `task-submission`, `vm-execution`).
        - **Modified Capabilities**: Existing capabilities whose REQUIREMENTS change.
          Check `openspec/specs/` for existing names. Leave empty if none.
      - **Constraints & Assumptions**: Hard constraints (tech, budget, deadline) and
        assumptions you are making. Flag every assumption the user has not confirmed.
      - **Open Questions**: Decisions only the user can make. These feed the grilling
        session - phrase each as a concrete question with your recommended answer.

      Keep it to 1-2 pages. Research existing specs before filling in Capabilities.
    requires: []

  - id: ux
    generates: ux.md
    description: User experience - flows, screens, and states for user-facing surface
    template: ux.md
    instruction: |
      Describe the user experience for any user-facing surface in this change.
      If the change has NO user-facing surface, write ux.md with a single line
      explaining why (e.g., "Backend-only change; no UX surface.") and stop.

      Sections:
      - **Flows**: One `### Flow: <name>` per user journey. Numbered steps from entry
        to exit, including failure paths.
      - **Screens & States**: One subsection per screen/view. For each: purpose, key
        elements, and the non-happy states (loading, empty, error, partial). Unhandled
        states are where UIs rot - enumerate them.
      - **Component Inventory**: Map screens to the component library (e.g., shadcn/ui
        primitives) so implementation doesn't invent one-off components.
      - **Open Questions**: UX decisions only the user can make, with recommendations.

      Text and simple diagrams (mermaid) only - no pixel mockups. Reference PRD goals;
      every flow should serve a stated goal.
    requires:
      - prd

  - id: specs
    generates: "specs/**/*.md"
    description: Testable requirements deltas per capability
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the PRD's Capabilities section.
      - New capabilities: use the exact kebab-case name from the PRD (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/
        when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags
        or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Specs should be testable - each scenario is a potential test case, and scenarios
      are the acceptance criteria that delegated tasks verify against.
    requires:
      - prd

  - id: tech-plan
    generates: tech-plan.md
    description: Technical plan - architecture, decisions with alternatives, and interfaces
    template: tech-plan.md
    instruction: |
      Create the tech plan that explains HOW to implement the change. This is where
      architectural decisions are made and defended.

      Sections:
      - **Context**: Current state, constraints, what exists already.
      - **Goals / Non-Goals**: Technical goals only (the product goals live in the PRD).
      - **Architecture**: The shape of the system. A mermaid diagram plus prose. Name
        every component and its single responsibility.
      - **Decisions**: The heart of the document. One `### D<n>: <title>` per decision:
        - **Choice**: what was picked
        - **Alternatives**: each rejected option with the REASON it lost
        - **Revisit if**: the condition under which this decision should be reopened
        Present real alternatives - a decision without a credible loser is a
        description, not a decision. Promote decisions that outlive this change
        (stack choices, protocols, security boundaries, data ownership) to ADRs
        using the `adr` skill, and link them here.
      - **Interfaces & Data**: The contracts BETWEEN components: API shapes, message
        schemas, state machines, data models. These are the seams along which work
        gets delegated - two agents can build opposite sides of an interface defined
        here without talking to each other.
      - **Risks / Trade-offs**: Format: [Risk] → Mitigation.
      - **Rollout**: Deploy order, rollback strategy, migration steps (if applicable).
      - **Open Questions**: Technical decisions needing user input, with recommendations.

      Reference the PRD for motivation and specs for requirements. Focus on
      architecture and contracts, not line-by-line implementation.
    requires:
      - prd

  - id: tasks
    generates: tasks.md
    description: Implementation checklist grouped into delegable work streams
    template: tasks.md
    instruction: |
      Break the implementation into work streams that can each be delegated to an
      independent agent (cloud or local) with no shared conversational context.

      **IMPORTANT: Follow the template exactly.** The apply phase parses checkbox
      format to track progress. Tasks not using `- [ ]` won't be tracked.

      Structure:
      - Each `## <n>. <Work Stream>` heading is one delegable unit of work.
      - Directly under each heading, a metadata line:
        `> Depends-on: <group numbers or -> | Touches: <path globs> | Verify: <command>`
      - Then the tasks: `- [ ] N.M Task description`

      Rules for delegability:
      - Two work streams with no Depends-on relationship MUST NOT touch the same
        paths - parallel agents cannot coordinate edits.
      - Work streams communicate only through interfaces declared in the tech plan.
        If two streams need a contract that isn't in the tech plan, fix the tech
        plan first.
      - Each task references what it satisfies (spec scenario or tech-plan decision)
        when not obvious.
      - `Verify` must be a real command an agent can run (test, typecheck, build) -
        "manually check" is not verification.
      - Tasks small enough to complete in one session; order by dependency.
    requires:
      - specs
      - tech-plan

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the change's artifacts (prd, ux, specs, tech-plan, tasks), work through
    pending tasks respecting work-stream Depends-on order, and mark tasks complete
    as you go. Run each work stream's Verify command before marking its tasks done.
    Pause if you hit blockers or need clarification. To fan work out instead of
    executing locally, use the `delegate` skill to produce self-contained briefs.
