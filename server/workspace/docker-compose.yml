# Run the workspace image locally, with a collector to send telemetry to.
#
#   docker compose up --build          # workspace on :4000 + OTLP collector
#   docker compose up workspace        # workspace alone, telemetry off
#   docker compose logs -f otel-collector
#
# If something already holds :4000 (a `pnpm dev` or a mock gateway), Docker
# will still report the container as started while your requests go to the
# other process — set WORKSPACE_PORT=4600 rather than debugging a phantom.
#
# The image built here is tagged exactly as scripts/image.sh tags it, so
# `docker compose build` and `scripts/image.sh build` are interchangeable.
#
# For the AWS-parity backends (dynamodb-local + MinIO) use the compose file at
# the repo root — that stack is what the `*-dynamodb` and `fs-s3` test suites
# talk to, and duplicating it here would mean two sets of host ports fighting
# over the same numbers.

name: aprovan-workspace

services:
  workspace:
    image: ghcr.io/aprovanlabs/workspace:${WORKSPACE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/workspace/Dockerfile
    ports:
      - "${WORKSPACE_PORT:-4000}:4000"
    environment:
      WORKSPACE_MODE: local
      WORKSPACE_DATA_DIR: /data
      WORKSPACE_PORT: "4000"

      # Presence of this endpoint is what turns telemetry on (see
      # src/server.ts). Traces go to the collector over OTLP/HTTP.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: workspace
    volumes:
      # Local mode persists workspace.db here. Bind-mounted rather than a named
      # volume so you can inspect and delete it like an ordinary file.
      - ./data:/data
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
