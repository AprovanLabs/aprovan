name: Publish Packages to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          pnpm \
            --filter @aprovan/ui \
            --filter @aprovan/registry-main \
            --filter @aprovan/registry-ui \
            --filter @aprovan/sandbox-bashkit \
            --filter @aprovan/sandbox-image-node \
            --filter @aprovan/sandbox-host \
            --filter @aprovan/cli \
            --filter @aprovan/patchwork \
            --filter @aprovan/editor \
            build
      - run: |
          failed=""
          for pkg in \
            @aprovan/ui \
            @aprovan/registry-main \
            @aprovan/registry-ui \
            @aprovan/sandbox-bashkit \
            @aprovan/sandbox-image-node \
            @aprovan/sandbox-host \
            @aprovan/cli \
            @aprovan/patchwork \
            @aprovan/editor; do
            dir=$(pnpm --filter "$pkg" exec pwd 2>/dev/null | tail -1) || continue
            version=$(node -p "require('$dir/package.json').version")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published — skipping"
              continue
            fi
            echo "Publishing $pkg@$version"
            out=$(mktemp)
            if pnpm --filter "$pkg" publish --no-git-checks --access public >"$out" 2>&1; then
              cat "$out"
            else
              cat "$out"
              if grep -qE 'previously published versions|cannot publish over the previously published' "$out"; then
                echo "$pkg@$version already published — treating as success"
              else
                failed="$failed $pkg"
              fi
            fi
          done
          [ -z "$failed" ] || (echo "Failed:$failed" && exit 1)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
