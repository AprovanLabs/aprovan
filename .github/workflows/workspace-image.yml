name: Publish Workspace Image

on:
  push:
    branches: [main]
    paths:
      - "server/workspace/**"
      - "packages/**"
      - "infra/workspace/**"
      - "pnpm-lock.yaml"
      - "scripts/image.sh"
      - "scripts/deploy-infra.sh"
      - ".github/workflows/workspace-image.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll the ECS service onto the new image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: workspace-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aprovanlabs/workspace
  ENVIRONMENT: prd

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: server/workspace/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/AprovanLabs/aprovan
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - id: export
        run: |
          arch="${{ matrix.platform }}"
          echo "digest-${arch#linux/}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.build.outputs.digest-arm64 }}"

  deploy:
    name: Roll the service
    runs-on: ubuntu-latest
    needs: publish
    # Owner cutover (stream 9): only roll when deploy is explicitly requested
    # and the role ARN is set. Default push builds publish the image but do
    # not mutate ECS — avoids red main when OIDC trust is not yet wired.
    if: >
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: ./scripts/deploy-infra.sh "${{ needs.publish.outputs.tag }}"
