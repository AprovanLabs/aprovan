name: Desktop

# Build and (when secrets allow) sign + notarize the macOS shell.
# Shell updates publish to the generic feed in electron-builder.yml —
# independent of the OTA renderer bundle channel.
#
# Required for a releasable (Gatekeeper-clean) build:
#   secrets.CSC_LINK, secrets.CSC_KEY_PASSWORD
#   and either:
#     secrets.APPLE_API_KEY + secrets.APPLE_API_KEY_ID + secrets.APPLE_API_ISSUER
#   or:
#     secrets.APPLE_ID + secrets.APPLE_APP_SPECIFIC_PASSWORD + secrets.APPLE_TEAM_ID
#
# Bundle-manifest signing (separate from Apple):
#   secrets.BUNDLE_SIGNING_PRIVATE_KEY — CI only; public pin lives in
#   desktop/src/bundle-public-key.ts (rotation ⇒ shell update). See
#   desktop/docs/signing.md.
#
# Native helper (macos-native-providers):
#   native/macos-helper is built (SwiftPM release) into
#   desktop/build/macos-helper and packed under Resources/macos-helper.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "native/macos-helper/**"
      - ".github/workflows/desktop.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to the shell release feed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (unsigned)
    if: github.event_name == 'pull_request'
    # macos-15 ships Xcode 16 / Swift Testing (import Testing).
    # macos-14's default toolchain lacks the Testing module.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build main + test
        run: |
          pnpm --filter @aprovan/desktop build:main
          pnpm --filter @aprovan/desktop test
          pnpm --filter @aprovan/desktop check-types
      - name: Build + test Swift helper
        run: |
          swift test --package-path native/macos-helper
          bash desktop/scripts/build-helper.sh
          test -x desktop/build/macos-helper/macos-helper
      - name: Package unsigned dir (scaffolding smoke)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Resources may be incomplete on PR; builder still validates config.
          DESKTOP_SKIP_RESOURCES: "1"
        run: |
          # Prepare minimal placeholders so electron-builder can resolve extraResources.
          # macos-helper was built in the previous step.
          mkdir -p resources/bundle build/gateway build/runtime/node/bin
          printf '%s\n' '<!doctype html><title>seed</title>' > resources/bundle/index.html
          printf '%s\n' '#!/bin/sh' > build/runtime/node/bin/node
          chmod +x build/runtime/node/bin/node
          mkdir -p resources/esm-seed
          printf '%s\n' '{"packages":[]}' > resources/esm-seed/manifest.json
          test -x build/macos-helper/macos-helper
          pnpm exec electron-builder --config electron-builder.yml --mac --arm64 --dir
          test -x release/mac-arm64/Aprovan.app/Contents/Resources/macos-helper/macos-helper

  release:
    name: Sign, notarize, staple
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Require Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD are required for a signed release."
            echo "See desktop/docs/signing.md — do not distribute unsigned builds."
            exit 1
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "Notarization auth: App Store Connect API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarization auth: Apple ID + app-specific password"
          else
            echo "::error::Provide APPLE_API_KEY{,_ID} + APPLE_API_ISSUER (preferred) or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID."
            exit 1
          fi
          if [ -z "${{ secrets.BUNDLE_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::warning::BUNDLE_SIGNING_PRIVATE_KEY is unset. Shell signing will proceed; OTA manifest signing is not available until the secret is configured (desktop/docs/signing.md)."
          fi

      - name: Build desktop resources + signed dist
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Prefer publishing only when explicitly requested or on a desktop-v* tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # prepare-resources.sh builds the Swift helper into build/macos-helper.
          pnpm run build
          test -x build/macos-helper/macos-helper
          pnpm run dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aprovan-desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
