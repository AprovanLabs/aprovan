# Packaging for @aprovan/desktop (macOS arm64 only — platform floor).
# Signing + notarization activate when CSC_* / APPLE_* secrets are present;
# otherwise `pnpm dist` produces an unsigned local artifact for smoke checks.

appId: com.aprovan.desktop
productName: Aprovan
copyright: Copyright © Aprovan Labs

directories:
  output: release
  buildResources: build

# Main/preload compiled by tsup into dist/; do not pack desktop/src.
files:
  - dist/**/*
  - package.json
  - "!**/*.{md,map}"
  - "!**/__tests__/**"

# Seed renderer + vendored gateway/runtime live beside the .app Resources
# (see desktop/src/paths.ts packaged layout).
extraResources:
  - from: resources/bundle
    to: bundle
  - from: resources/esm-seed
    to: esm-seed
  # Gateway (incl. node_modules) is copied in afterPack — electron-builder
  # strips node_modules from extraResources, which broke packaged startups.
  - from: build/runtime/node
    to: runtime/node
  # Swift helper (macos-native-providers). Signed with entitlementsInherit
  # under Hardened Runtime when CSC_* secrets are present.
  - from: build/macos-helper
    to: macos-helper
  # Bundled STT default (voice stream 1). Fetched hash-pinned by fetch-stt-models.sh.
  - from: build/models
    to: models
    filter:
      - "**/*"
      - "!**/*.partial"
asar: true

afterPack: scripts/copy-gateway-modules.cjs

# Shell update feed — independent of the OTA renderer bundle channel (D6).
# electron-updater reads latest-mac.yml from this URL; artifacts are
# Developer ID–signed (and notarized) so Gatekeeper verifies the update.
publish:
  provider: generic
  url: https://releases.aprovan.com/desktop
  channel: latest

mac:
  category: public.app-category.developer-tools
  icon: icon.png
  extendInfo:
    CFBundleName: Aprovan
    CFBundleDisplayName: Aprovan
  # Apple Silicon only (desktop platform floor).
  target:
    - target: dmg
      arch:
        - arm64
    # zip required for electron-updater differential/full updates on macOS
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  # Notarize when the build is signed (CI with APPLE_*). Unsigned local
  # `dist:dir` skips notarization because there is nothing to staple.
  notarize: true
  minimumSystemVersion: "14.0"
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  sign: true

# electron-updater verifies the Developer ID signature on downloaded updates.
# Do not point this publish block at the renderer bundle CDN.
